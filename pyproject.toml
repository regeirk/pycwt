[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"


[project]
name = "pycwt"
dynamic = ["version"]
dependencies = [
    "numpy>=2.0, <3",
    "scipy>=1.10, <2",
    "matplotlib>=3.7, <4",
    "tqdm>=4.65, <5"
]
description = "Continuous wavelet transform module for Python."
license = "BSD-3-Clause"
license-files = ["LICEN[CS]E*"]
authors = [
    {name="Sebastian Krieger", email="sebastian@nublia.com"},
    {name="Nabil Freij"},
    {name="and contributors"}
]
maintainers = [
    {name="Sebastian Krieger", email="sebastian@nublia.com"}
]
readme = "README.md"
requires-python = ">=3.10"
keywords = ["wavelet", "spectral analysis", "signal processing", "data science", "timeseries", "time series"]
classifiers = [
    'Development Status :: 3 - Alpha',
    'License :: OSI Approved :: BSD License',
    'Programming Language :: Python',
    'Programming Language :: Python :: 3',
    'Operating System :: OS Independent',
    'Topic :: Software Development :: Libraries :: Python Modules',
    'Topic :: Utilities',
    'Intended Audience :: Science/Research'
]


[project.urls]
repository = "https://github.com/regeirk/pycwt"
documentation = "https://pycwt.readthedocs.io/"
issues = "https://github.com/regeirk/pycwt/issues"


[tool.hatch.version]
source = "vcs"
